name: Test & Release

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

env:
  TURBO_LOG_ORDER: stream

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/test.yml

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/setup@v2
        with:
          cache: true
      - name: Install npm for OIDC
        run: npm install -g npm@latest
      - name: Fix versions
        run: pnpm run versions:fix
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo|release|${{ github.sha }}
          restore-keys: turbo|release|
      - name: Build
        run: pnpm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_WORKSPACES: "false"
        run: pnpm run release
