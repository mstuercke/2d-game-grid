name: Test & Release

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

env:
  TURBO_LOG_ORDER: stream
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/test.yml

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          cache: true

      - name: Fix versions
        run: pnpm run versions:fix

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo|release|${{ github.sha }}
          restore-keys: turbo|release|

      - name: Release
        run: pnpm run release
